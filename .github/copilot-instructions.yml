commands:
  - name: daily summary
    description: Generates a structured bilingual (EN/ES) development summary from commits based on develop, validating real dates and grouping by day.
    prompt: |
      @workspace

      Generate a **structured Development Summary (EN/ES)** using all commits made since the current branch was created from `develop`.

      @terminal run:
      git log $(git merge-base develop HEAD)..HEAD --pretty=fuller

      ### 🧠 Analysis Rules
      - Read each commit’s `Date:` field to determine the **exact calendar date** (day, month, year).
      - Identify the **real weekday name** (e.g., `Wed Oct 22 2025` → “Wednesday, October 22”).
      - Group commits by natural calendar day, **not by commit order**.
      - If `days: total` → use all commits since the branch was created.
      - If `days: [number]` → use only commits matching that specific date (e.g., `days: 22` → commits from October 22).
      - Detect the Jira ticket automatically from the branch name (e.g., `TH-29`).

      ### 🧩 Output Format
      The response **must strictly follow this structure and formatting**:

      ```
      📊 Development Summary - TH-29
      🗓️ Daily Summaries

      [Tuesday, October 21:]
      Development Summary (TH-29 - First Sign In Recency Analytics)

      Full development of the analytics module for new accounts without login was initiated. Work focused on establishing the base architecture of the feature, including the creation of all necessary components for the analytics endpoint functionality.

      **Key Points:**
      - Added LAST_14_DAYS time preset to the time range enum to support last 14 days analysis
      - Created 4 fundamental DTOs: NewAccountsWithoutLoginQueryDto (request), NewAccountsWithoutLoginSummaryDto, UsersWithNewAccountsWithoutLoginDto, and NewAccountsWithoutLoginResponseDto (response)
      - Implemented controller with the new analytics endpoint
      - Created mappers for data transformation from BigQuery
      - Developed builder service for BigQuery query construction
      - Implemented calculator service for summary metrics generation
      - Integrated main service that orchestrates all business logic
      - Performed minor DTO correction to adjust response structure

      **In Summary:**
      The complete feature architecture was implemented on the first day, with all main components (DTOs, services, mappers, and controller) working in an integrated manner and ready for testing.

      [Wednesday, October 22:]
      Development Summary (TH-29 - First Sign In Recency Analytics)

      The documentation, exhaustive testing, and module refinement phase was completed. The main focus was ensuring code quality through comprehensive testing and improving API documentation for service consumers.

      **Key Points:**
      - Added complete Swagger/OpenAPI documentation for the endpoint with detailed examples and descriptions
      - Implemented comprehensive unit tests for all services: builder, main service, and summary calculator
      - Updated ApiProperty type definitions for clarity in automatic documentation
      - Fixed typos and improved descriptions in response DTOs
      - Corrected duplicate user.id dimension in builder service
      - Standardized DTO mapping keys using camelCase for consistency
      - Added summary DTO for aggregated metrics
      - Performed minor updates in DTO imports and exports

      **In Summary:**
      The module is fully functional, documented, and tested, with comprehensive unit test coverage for all critical services, ready for client integration, and optimized without duplications.

      🔗 Branch Information
      Branch: feature/TH-29_first_sign_in_recency  
      Base: develop  
      🔗 Jira Ticket: [TH-29](https://cercana-ti.atlassian.net/browse/TH-29)
      ```

      ### 🌍 Language
      - The summary must be in **English** by default.
      - Optionally, append the Spanish version below each day if bilingual output is desired.

      ### ⚙️ Parameters
      ```
      days: total
      ```

      ### 🚫 Rules
      - Do NOT modify or create files.
      - Do NOT assume weekday order—calculate from real dates.
      - Keep formatting identical to the template above.
      - Markdown output only, no HTML.

  - name: pr generator
    description: Generates a complete Pull Request body by reading PULL_REQUEST_TEMPLATE.md and filling it strictly with information from all commits since the branch was created from develop.
    prompt: |
      🧭 EXECUTION CONTEXT
      Act as a technical agent within the current project.  
      Do not modify, create, or commit any files.  
      Do not open, update, or merge Pull Requests.  

      Your task is to **read the file `PULL_REQUEST_TEMPLATE.md`** and **return a single, complete Pull Request message** in chat.  
      You must fill it **100% strictly according to the structure and content of that template** — no omissions, no reordering, no additions.  
      The resulting text must look exactly as if a developer had manually completed the template.

      ---

      ## 🔍 OBJECTIVE
      Build a fully completed Pull Request message following **exactly** the format, structure, and emojis found in `PULL_REQUEST_TEMPLATE.md`,  
      using as data all commits made since the current branch was created from `develop`.

      ---

      ## 🧠 EXECUTION STEPS

      1. **Locate and read the template**
         - Search for `PULL_REQUEST_TEMPLATE.md` in:
           - `.github/`
           - `docs/`
           - or the project root.
         - Read the full content of the template.
         - Identify each section and subsection (headings, emojis, checklists, lists, etc.).
         - You must **replicate its structure exactly** in your output.
         - Do **not** add any new sections, sentences, explanations, or commentary.
         - Do **not** omit or summarize any required section.
         - Every section in the template must be present in the output — filled in with inferred data from commits.

      2. **Retrieve all commits since the branch was created**
         - Run this command to read the complete commit history from the point where the branch diverged from `develop`:
           @terminal run:
           git log $(git merge-base develop HEAD)..HEAD --pretty=fuller
         - If the base branch is not `develop`, fallback automatically to `main` or `master`.
         - Use all commit messages and timestamps as the only source of information to populate the PR.

      3. **Analyze commits**
         - Interpret commit prefixes:
           - `feat:` → new feature or endpoint.
           - `fix:` → bug fix or correction.
           - `refactor:` → internal improvement or optimization.
           - `test:` → test creation or modification.
           - `docs:` → documentation or comments.
           - `chore:` → maintenance tasks.
         - Detect and summarize:
           - Main purpose of the branch.
           - New features or functionalities added.
           - Structural or architectural changes.
           - Libraries added or updated.
           - Tests implemented or updated.
           - API endpoints added or modified.
           - Documentation updates or refactors.
         - Detect any Jira ticket ID in the branch name (e.g., `TH-29`) for reference.

      4. **Fill the Pull Request Template**
         - Use the `PULL_REQUEST_TEMPLATE.md` file **as the single, authoritative structure**.
         - For each section, write content derived from commit analysis, matching the intended context:
           - **🚀 Overview:** concise summary of purpose and scope.
           - **📋 Changes Made:** describe architecture, core features, tests, libraries, endpoints, etc.
           - **✅ Testing, 🔍 Validation, 📚 Documentation:** complete checklists and details logically.
         - Fill every section **fully** — do not leave placeholders empty.
         - Preserve original Markdown formatting, bullet points, and emojis.

      5. **Add Branch and Jira Ticket Info**
         - Run this command to detect the current branch:
           @terminal run:
           git rev-parse --abbrev-ref HEAD
         - If the branch name includes a Jira ticket ID (e.g., `TH-29`), generate a link using:
           ```
           https://cercana-ti.atlassian.net/browse/TH-29
           ```
         - Append this block at the end of the Pull Request:
           ```
           **Branch:** `feature/TH-29_first_sign_in_recency`
           **Base:** `develop`
           🔗 **Jira Ticket:** [TH-29](https://cercana-ti.atlassian.net/browse/TH-29)
           ```

      6. **If `PULL_REQUEST_TEMPLATE.md` is not found**
         - Return exactly:
           ⚠️ No `PULL_REQUEST_TEMPLATE.md` file found in the repository. Unable to generate Pull Request content.

      ---

      ## ⚙️ RULES
      - You must fill **only** what exists in the template — nothing else.
      - Do not add summaries, overviews, or commentary outside the structure.
      - The output must mirror the Markdown style, headers, emojis, and order of the template exactly.
      - Do not alter capitalization, indentation, or symbols.
      - Language: **English**
      - Output format: **Markdown**
      - File modifications: **not allowed**
